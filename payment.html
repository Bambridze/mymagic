<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест оплаты S PRODUCTION</title>
    
    <!-- 1. ПОДКЛЮЧАЕМ ПРАВИЛЬНЫЙ ИНСТРУМЕНТ ИЗ ДОКУМЕНТАЦИИ -->
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    
    <script type="text/javascript">
        // 2. Инициализируем песочницу
        Paddle.Environment.set("sandbox");

<body style="font-family: sans-serif; text-align: center; padding-top: 100px; background-color: #f4f4f9;">
