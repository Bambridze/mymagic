<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест оплаты S PRODUCTION</title>
    <script src="https://paddle.com"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 100px;">

    <button id="pay-button" style="background: #2196F3; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold;">
        Оплатить счет
    </button>

    <script>
        Paddle.Environment.set("sandbox");
        Paddle.Initialize({ 
            token: "test_162de7add7ab96901f3143b6036" 
        });

        // Хитрый скрипт: вытаскиваем номер транзакции из адреса страницы
        const urlParams = new URLSearchParams(window.location.search);
        const transactionIdFromUrl = urlParams.get('_ptxn');

        document.getElementById('pay-button').addEventListener('click', function() {
            
            // Если мы пришли по ссылке из инвойса и у нас есть ID транзакции
            if (transactionIdFromUrl) {
                console.log("Оплачиваем инвойс:", transactionIdFromUrl);
                Paddle.Checkout.open({
                    transactionId: transactionIdFromUrl, // Передаем ID счета вместо товара
                    settings: {
                        displayMode: "overlay",
                        locale: "ru"
                    }
                });
            } else {
                // Если зашли на сайт просто так — открываем обычную покупку Премиума
                console.log("Обычная покупка товара");
                Paddle.Checkout.open({
                    items: [{
                        priceId: "pri_01m1mn9bh6ktksze0sgtych7mg",
                        quantity: 1
                    }],
                    settings: {
                        displayMode: "overlay",
                        locale: "ru"
                    }
                });
            }
        });
    </script>
</body>
</html>
