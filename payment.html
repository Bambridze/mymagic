<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест оплаты S PRODUCTION</title>
    <!-- Официальный скрипт-загрузчик Paddle v3 -->
    <script src="https://paddle.com"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 100px; background-color: #f4f4f9;">

    <div style="background: white; display: inline-block; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h2>S PRODUCTION</h2>
        <p style="color: #666; margin-bottom: 30px;">Тестирование активации Премиума</p>
        
        <button id="pay-button" style="background: #2196F3; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold;">
            Купить Премиум
        </button>
    </div>

    <script type="text/javascript">
        // Переменная, где будет храниться рабочий объект платежки
        let paddleInstance;

        // ПРАВИЛЬНЫЙ запуск Paddle v3 через асинхронный метод библиотеки
        Paddle.Environment.set("sandbox");
        Paddle.Initialize({ 
            token: "test_162de7add7ab96901f3143b6036" 
        }).then((instance) => {
            // Как только Пэддл загрузился, сохраняем его рабочую копию
            paddleInstance = instance;
            console.log("Paddle v3 успешно инициализирован!");
        }).catch((error) => {
            alert("Ошибка загрузки Paddle: " + error.message);
        });

        // Клик по кнопке
        document.getElementById('pay-button').addEventListener('click', function() {
            if (!paddleInstance) {
                alert("Платежная система еще загружается, подождите секунду...");
                return;
            }

            // Вызываем чекаут через сохраненный объект, как требует дока v3
            paddleInstance.Checkout.open({
                settings: {
                    displayMode: "overlay",
                    locale: "ru"
                },
                items: [
                    {
                        priceId: "pri_01m1mn9bh6ktksze0sgtych7mg", // Твой ID Премиума
                        quantity: 1
                    }
                ],
                customer: {
                    email: "test-valera@example.com"
                }
            });
        });
    </script>
</body>
</html>
