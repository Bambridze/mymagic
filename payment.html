<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест оплаты S PRODUCTION</title>
    <!-- Подключаем библиотеку Paddle.js -->
    <script src="https://paddle.com"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 100px; background-color: #f4f4f9;">

    <div style="background: white; display: inline-block; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h2 style="margin-bottom: 10px;">S PRODUCTION</h2>
        <p style="color: #666; margin-bottom: 30px;">Тестирование активации Премиума</p>
        
        <button id="pay-button" style="background: #2196F3; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s;">
            Купить Премиум
        </button>
    </div>

    <script>
        // Включаем тестовую среду (Sandbox)
        Paddle.Environment.set("sandbox");

        // Инициализируем Paddle твоим токеном фронтенда
        Paddle.Initialize({ 
            token: "test_162de7add7ab96901f3143b6036" 
        });

        // Навешиваем событие оплаты на кнопку
        document.getElementById('pay-button').addEventListener('click', function() {
            Paddle.Checkout.open({
                settings: {
                    displayMode: "overlay", // Всплывающее окно поверх сайта
                    locale: "ru"
                },
                items: [
                    {
                        priceId: "pri_01m1mn9bh6ktksze0sgtych7mg", // Твой Price ID Премиума
                        quantity: 1
                    }
                ],
                customer: {
                    email: "test-valera@example.com" // Предзаполненный email для теста
                }
            });
        });
    </script>
</body>
</html>
